name: Congatudo (mop fork)
version: 2024.04-mop.2
slug: congatudo
init: false
description: Congatudo 2024.04 with room mopping when the water tank is attached
url: https://github.com/Sloy/congatudo-add-on
arch:
  - amd64
startup: application
boot: auto
services:
  - mqtt:want
ports:
  8080/tcp: null
  4010/tcp: 4010
  4030/tcp: 4030
  4050/tcp: 4050
ports_description:
  8080/tcp: "webui"
  4010/tcp: "conga cmd port"
  4030/tcp: "conga map port"
  4050/tcp: "conga rtc port"
map:
  - config:rw
ingress: true
ingress_port: 8080
panel_icon: mdi:robot-vacuum
schema:
  debug: bool?
